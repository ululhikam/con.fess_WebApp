<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0038FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Verifikasi domain fessncurious.vercel.app di Meta Business
      (Business Settings > Brand safety > Domains). Jangan dihapus —
      Meta dapat mengecek ulang secara berkala.
    -->
    <meta name="facebook-domain-verification" content="itcukd16r3er5bo9clet1ethkbvij2" />
    <meta
      name="description"
      content="Fess n Curious — platform sosial anonim berbasis Base dengan auto-routing, canvas render, dan moderasi AI."
    />
    <title>Fess n Curious - Auto-Base Social Platform &amp; Anon Engine</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fess n Curious - Auto-Base Social Platform" />
    <meta property="og:description" content="Platform sosial anonim berbasis Base dengan auto-routing, canvas render, dan moderasi AI." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Fess n Curious" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fess n Curious - Auto-Base Social Platform" />
    <meta name="twitter:description" content="Platform sosial anonim berbasis Base dengan auto-routing, canvas render, dan moderasi AI." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Google Fonts: Poppins, Courier Prime & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&display=swap&font-display=swap"
      rel="stylesheet"
    />

    <!-- DNS prefetch + preconnect for backend API & storage (speeds up first API call) -->
    <link rel="dns-prefetch" href="https://be-fnc.vercel.app" />
    <link rel="preconnect" href="https://be-fnc.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.co" />


    <!--
      Theme bootstrap — runs BEFORE first paint so there is no flash of the
      wrong theme (FOUC). Mirrors src/composables/useTheme.js.
      Modes: 'system' (default) | 'dark' | 'light'
    -->
    <script>
      (function () {
        var el = document.documentElement;
        var mode = null;
        try {
          mode = localStorage.getItem('fess_theme');
        } catch (e) {}
        if (mode !== 'dark' && mode !== 'light') {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        el.setAttribute('data-theme', mode);
      })();
    </script>
  </head>
  <body class="cyber-dark-body">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
